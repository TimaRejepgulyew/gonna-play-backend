$kind: http-request
url: "{{baseUrl}}/api/match/:id"
method: PUT
headers:
  Content-Type: application/json
pathVariables:
  - key: id
    value: "{{matchId}}"
    description: "(Required) "
body:
  type: json
  content: '{ "status": "COMPLETED" }'
auth:
  type: bearer
  credentials:
    token: "{{orgToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Организатор завершает матч → 2xx", function () {
        pm.expect(pm.response.code).to.be.within(200, 299);
      });
    language: text/javascript
order: 9000
