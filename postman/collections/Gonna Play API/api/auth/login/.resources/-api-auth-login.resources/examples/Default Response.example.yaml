$kind: http-example
request:
  url: "{{baseUrl}}/api/auth/login"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "email": "<email>",
        "password": "<string>"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "user": {
          "id": "<integer>",
          "email": "<string>",
          "name": "<string>",
          "playerId": "<integer>"
        },
        "accessToken": "<string>",
        "refreshToken": "<string>"
      }
order: 1000
