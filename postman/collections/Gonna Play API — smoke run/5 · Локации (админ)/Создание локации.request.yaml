$kind: http-request
url: "{{baseUrl}}/api/location/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{ "name": "Smoke Arena {{runId}}", "address": "Main St 1", "city":
    "Ashgabat", "country": "TM" }'
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Создание локации → 2xx", function () {
        pm.expect(pm.response.code).to.be.within(200, 299);
      });
      var d = pm.response.json();
      pm.collectionVariables.set("locationId", d.id);
    language: text/javascript
order: 1000
