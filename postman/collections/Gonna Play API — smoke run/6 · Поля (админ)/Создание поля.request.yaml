$kind: http-request
url: "{{baseUrl}}/api/field/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{ "name": "Smoke Field", "locationId": {{locationId}}, "format":
    "SEVEN_V_SEVEN" }'
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Создание поля → 2xx", function () {
        pm.expect(pm.response.code).to.be.within(200, 299);
      });
      var d = pm.response.json();
      pm.collectionVariables.set("fieldId", d.id);
    language: text/javascript
order: 1000
