$kind: http-request
url: "{{baseUrl}}/api/match/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{ "fieldId": {{fieldId}}, "startTime": "{{futureDate}}", "format":
    "SEVEN_V_SEVEN", "maxPlayers": 4, "price": 50, "durationMinutes": 90 }'
auth:
  type: bearer
  credentials:
    token: "{{orgToken}}"
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set("futureDate", new Date(Date.now() + 7 *
      864e5).toISOString());
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Организатор создаёт матч → 2xx", function () {
        pm.expect(pm.response.code).to.be.within(200, 299);
      });
      var d = pm.response.json();
      pm.collectionVariables.set("matchId", d.id);
    language: text/javascript
order: 1000
