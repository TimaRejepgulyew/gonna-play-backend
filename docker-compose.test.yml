services:
  backend:
    build: .
    environment:
      - NODE_ENV=test
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/gonna_play_db_test
    depends_on:
      - db
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run test

  db:
    image: postgres:13
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=gonna_play_db_test
    ports:
      - '5432:5432'
    volumes:
      - postgres_data_test:/var/lib/postgresql/data

volumes:
  postgres_data_test: 