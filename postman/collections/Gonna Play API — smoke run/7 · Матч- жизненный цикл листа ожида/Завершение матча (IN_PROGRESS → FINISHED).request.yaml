$kind: http-request
url: "{{baseUrl}}/api/match/:id"
method: PATCH
headers:
  Content-Type: application/json
pathVariables:
  - key: id
    value: "{{matchId}}"
    description: "(Required) "
body:
  type: json
  content: '{ "status": "FINISHED" }'
auth:
  type: bearer
  credentials:
    token: "{{orgToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Завершение матча (IN_PROGRESS → FINISHED) → 2xx", function () {
        pm.expect(pm.response.code).to.be.within(200, 299);
      });
      var d = pm.response.json();
      pm.test("матч завершён (FINISHED)", function () {
        pm.expect(d.status).to.equal("FINISHED");
      });
    language: text/javascript
order: 13000
