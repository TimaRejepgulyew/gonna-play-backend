$kind: http-request
url: "{{baseUrl}}/api/player/:id"
method: DELETE
pathVariables:
  - key: id
    value: "{{adminPlayerId}}"
    description: "(Required) "
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Удаление игрока администратора → 2xx", function () {
        pm.expect(pm.response.code).to.be.within(200, 299);
      });
    language: text/javascript
order: 7000
