$kind: http-request
url: "{{baseUrl}}/api/match/:id/leave"
method: POST
pathVariables:
  - key: id
    value: "{{matchId}}"
    description: "(Required) "
auth:
  type: bearer
  credentials:
    token: "{{p1Token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("player1 покидает матч → 2xx", function () {
        pm.expect(pm.response.code).to.be.within(200, 299);
      });
    language: text/javascript
order: 1000
