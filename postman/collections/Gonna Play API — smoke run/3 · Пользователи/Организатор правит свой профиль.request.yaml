$kind: http-request
url: "{{baseUrl}}/api/user/:id"
method: PUT
headers:
  Content-Type: application/json
pathVariables:
  - key: id
    value: "{{orgUserId}}"
    description: "(Required) "
body:
  type: json
  content: '{ "city": "Ashgabat" }'
auth:
  type: bearer
  credentials:
    token: "{{orgToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Организатор правит свой профиль → 2xx", function () {
        pm.expect(pm.response.code).to.be.within(200, 299);
      });
    language: text/javascript
order: 3000
