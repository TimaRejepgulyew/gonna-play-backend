$kind: http-example
request:
  url: "{{baseUrl}}/api/match/:id"
  method: PUT
  headers:
    Content-Type: application/json
  pathVariables:
    - key: id
      value: <string>
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "startTime": "<dateTime>",
        "durationMinutes": 60,
        "requiredLevel": "JUNIOR",
        "price": "<number>",
        "maxPlayers": "<integer>",
        "status": "OPEN"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
