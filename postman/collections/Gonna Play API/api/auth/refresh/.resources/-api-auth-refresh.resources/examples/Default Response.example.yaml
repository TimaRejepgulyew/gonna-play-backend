$kind: http-example
request:
  url: "{{baseUrl}}/api/auth/refresh"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "refreshToken": "<string>"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "accessToken": "<string>",
        "refreshToken": "<string>"
      }
order: 1000
