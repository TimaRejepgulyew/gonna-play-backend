$kind: http-request
name: Организатор подтверждает свою заявку
url: "{{baseUrl}}/api/match/:id/participants/:pid/accept"
method: POST
pathVariables:
  - key: id
    value: "{{matchId}}"
    description: "(Required) "
  - key: pid
    value: "{{orgPid}}"
    description: "(Required) "
auth:
  type: bearer
  credentials:
    token: "{{orgToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Организатор подтверждает свою заявку → 2xx", function () {
        pm.expect(pm.response.code).to.be.within(200, 299);
      });
    language: text/javascript
order: 5000
