$kind: http-example
request:
  url: "{{baseUrl}}/api/match/"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "fieldId": "<integer>",
        "startTime": "<dateTime>",
        "format": "FIVE_V_FIVE",
        "maxPlayers": "<integer>",
        "durationMinutes": 60,
        "requiredLevel": "JUNIOR",
        "price": "<number>"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
