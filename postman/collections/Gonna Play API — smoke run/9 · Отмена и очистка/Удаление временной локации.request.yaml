$kind: http-request
url: "{{baseUrl}}/api/location/:id"
method: DELETE
pathVariables:
  - key: id
    value: "{{locationId2}}"
    description: "(Required) "
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Удаление временной локации → 2xx", function () {
        pm.expect(pm.response.code).to.be.within(200, 299);
      });
    language: text/javascript
order: 6000
