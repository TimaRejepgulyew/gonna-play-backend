$kind: http-request
url: "{{baseUrl}}/api/field/:id"
method: GET
pathVariables:
  - key: id
    value: "{{fieldId}}"
    description: "(Required) "
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Поле по id (публичный) → 2xx", function () {
        pm.expect(pm.response.code).to.be.within(200, 299);
      });
    language: text/javascript
order: 4000
