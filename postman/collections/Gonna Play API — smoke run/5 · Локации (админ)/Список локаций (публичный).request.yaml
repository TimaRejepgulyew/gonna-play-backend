$kind: http-request
url: "{{baseUrl}}/api/location/list"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Список локаций (публичный) → 2xx", function () {
        pm.expect(pm.response.code).to.be.within(200, 299);
      });
    language: text/javascript
order: 3000
