$kind: http-example
name: Default Response
request:
  url: "{{baseUrl}}/api/auth/refresh"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "refreshToken": "<string>"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "<integer>",
        "message": "<string>"
      }
order: 2000
