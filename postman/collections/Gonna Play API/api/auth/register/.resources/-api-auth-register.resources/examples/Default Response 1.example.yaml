$kind: http-example
name: Default Response
request:
  url: "{{baseUrl}}/api/auth/register"
  method: POST
  headers:
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "email": "<email>",
        "password": "<string>",
        "birthDate": "<string>",
        "name": "<string>",
        "phone": "<string>",
        "city": "<string>",
        "country": "<string>",
        "gender": "<string>",
        "createPlayer": "<boolean>",
        "level": "JUNIOR",
        "position": "GOALKEEPER"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "code": "<integer>",
        "message": "<string>"
      }
order: 2000
