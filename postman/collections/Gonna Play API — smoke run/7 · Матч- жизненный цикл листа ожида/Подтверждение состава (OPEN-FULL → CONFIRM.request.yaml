$kind: http-request
name: Подтверждение состава (OPEN|FULL → CONFIRMED)
url: "{{baseUrl}}/api/match/:id/confirm"
method: POST
pathVariables:
  - key: id
    value: "{{matchId}}"
    description: "(Required) "
auth:
  type: bearer
  credentials:
    token: "{{orgToken}}"
scripts:
  - type: afterResponse
    code: >-
      pm.test("Подтверждение состава (OPEN|FULL → CONFIRMED) → 2xx", function ()
      {
        pm.expect(pm.response.code).to.be.within(200, 299);
      });

      var d = pm.response.json();

      pm.test("матч подтверждён (CONFIRMED)", function () {
        pm.expect(d.status).to.equal("CONFIRMED");
      });
    language: text/javascript
order: 10000
