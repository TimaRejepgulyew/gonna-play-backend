$kind: http-request
url: "{{baseUrl}}/api/location/:id"
method: GET
pathVariables:
  - key: id
    value: "{{locationId}}"
    description: "(Required) "
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Локация по id (публичный) → 2xx", function () {
        pm.expect(pm.response.code).to.be.within(200, 299);
      });
    language: text/javascript
order: 4000
