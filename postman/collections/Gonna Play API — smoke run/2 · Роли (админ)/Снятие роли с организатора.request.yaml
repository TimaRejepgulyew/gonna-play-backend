$kind: http-request
url: "{{baseUrl}}/api/role/revoke"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{ "userId": {{orgUserId}}, "roleId": {{roleId}} }'
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Снятие роли с организатора → 2xx", function () {
        pm.expect(pm.response.code).to.be.within(200, 299);
      });
    language: text/javascript
order: 4000
