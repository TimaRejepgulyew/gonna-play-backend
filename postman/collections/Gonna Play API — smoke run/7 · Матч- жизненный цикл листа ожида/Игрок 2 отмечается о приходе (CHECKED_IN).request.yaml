$kind: http-request
url: "{{baseUrl}}/api/match/:id/check-in"
method: POST
pathVariables:
  - key: id
    value: "{{matchId}}"
    description: "(Required) "
auth:
  type: bearer
  credentials:
    token: "{{p2Token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Игрок 2 отмечается о приходе (CHECKED_IN) → 2xx", function () {
        pm.expect(pm.response.code).to.be.within(200, 299);
      });
      var d = pm.response.json();
      pm.test("игрок 2 отмечен (CHECKED_IN)", function () {
        pm.expect(d.status).to.equal("CHECKED_IN");
      });
    language: text/javascript
order: 11000
