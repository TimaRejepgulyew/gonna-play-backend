$kind: http-request
name: Игрок 1 выходит — освобождается место
url: "{{baseUrl}}/api/match/:id/leave"
method: DELETE
pathVariables:
  - key: id
    value: "{{matchId}}"
    description: "(Required) "
auth:
  type: bearer
  credentials:
    token: "{{p1Token}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Игрок 1 выходит — освобождается место → 2xx", function () {
        pm.expect(pm.response.code).to.be.within(200, 299);
      });
    language: text/javascript
order: 8000
