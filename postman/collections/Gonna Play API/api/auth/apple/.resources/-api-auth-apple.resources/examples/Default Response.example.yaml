$kind: http-example
request:
  url: "{{baseUrl}}/api/auth/apple"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "identityToken": "<string>",
        "authorizationCode": "<string>",
        "user": {
          "name": {
            "firstName": "<string>",
            "lastName": "<string>"
          },
          "email": "<string>"
        },
        "nonce": "<string>"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "user": {
          "id": "<integer>",
          "email": "<string>",
          "name": "<string>",
          "playerId": "<integer>",
          "profileComplete": "<boolean>"
        },
        "accessToken": "<string>",
        "refreshToken": "<string>"
      }
order: 1000
