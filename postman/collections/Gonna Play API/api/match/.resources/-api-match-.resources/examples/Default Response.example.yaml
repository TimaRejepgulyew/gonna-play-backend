$kind: http-example
request:
  url: "{{baseUrl}}/api/match/"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "fieldId": "<integer>",
        "title": "<string>",
        "startsAt": "<dateTime>",
        "format": "FIVE",
        "minPlayers": "<integer>",
        "maxPlayers": "<integer>",
        "durationMin": 60,
        "price": "<number>",
        "currency": "<string>",
        "visibility": "PUBLIC",
        "skillMin": "JUNIOR",
        "skillMax": "JUNIOR",
        "description": "<string>"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
