$kind: http-request
url: "{{baseUrl}}/api/match/:id/publish"
method: POST
pathVariables:
  - key: id
    value: "{{matchId}}"
    description: "(Required) "
auth:
  type: bearer
  credentials:
    token: "{{orgToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Публикация матча (DRAFT → OPEN) → 2xx", function () {
        pm.expect(pm.response.code).to.be.within(200, 299);
      });
      var d = pm.response.json();
      pm.test("матч открыт (OPEN)", function () {
        pm.expect(d.status).to.equal("OPEN");
      });
    language: text/javascript
order: 2000
