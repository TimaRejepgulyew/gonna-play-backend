$kind: http-example
name: Default Response
request:
  url: "{{baseUrl}}/api/auth/telegram"
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "id": "<integer>",
        "first_name": "<string>",
        "auth_date": "<integer>",
        "hash": "<string>",
        "last_name": "<string>",
        "username": "<string>",
        "photo_url": "<string>"
      }
response:
  statusCode: 202
  statusText: Accepted
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": "link_required",
        "ticket": "<string>",
        "provider": "TELEGRAM",
        "email": "<string>",
        "methods": [
          "password"
        ]
      }
order: 2000
