$kind: http-request
name: /api/match/
url: "{{baseUrl}}/api/match/"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fieldId": "<integer>",
      "title": "<string>",
      "startsAt": "<dateTime>",
      "format": "FIVE",
      "minPlayers": "<integer>",
      "maxPlayers": "<integer>",
      "durationMin": 60,
      "price": "<number>",
      "currency": "<string>",
      "visibility": "PUBLIC",
      "skillMin": "JUNIOR",
      "skillMax": "JUNIOR",
      "description": "<string>"
    }
examples: ./.resources/-api-match-.resources/examples
order: 3000
