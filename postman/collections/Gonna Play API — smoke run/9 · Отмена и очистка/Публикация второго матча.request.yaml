$kind: http-request
url: "{{baseUrl}}/api/match/:id/publish"
method: POST
pathVariables:
  - key: id
    value: "{{matchId2}}"
    description: "(Required) "
auth:
  type: bearer
  credentials:
    token: "{{orgToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Публикация второго матча → 2xx", function () {
        pm.expect(pm.response.code).to.be.within(200, 299);
      });
    language: text/javascript
order: 2000
