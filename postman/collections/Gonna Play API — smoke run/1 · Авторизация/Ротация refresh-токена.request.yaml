$kind: http-request
url: "{{baseUrl}}/api/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{ "refreshToken": "{{adminRefresh}}" }'
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Ротация refresh-токена → 2xx", function () {
        pm.expect(pm.response.code).to.be.within(200, 299);
      });
      var d = pm.response.json();
      pm.collectionVariables.set("adminToken", d.accessToken);
      pm.collectionVariables.set("adminRefresh", d.refreshToken);
    language: text/javascript
order: 5000
