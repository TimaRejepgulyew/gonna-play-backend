$kind: http-example
request:
  url: "{{baseUrl}}/api/match/:id"
  method: PATCH
  headers:
    Content-Type: application/json
  pathVariables:
    - key: id
      value: <string>
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "title": "<string>",
        "startsAt": "<dateTime>",
        "durationMin": 60,
        "minPlayers": "<integer>",
        "maxPlayers": "<integer>",
        "price": "<number>",
        "currency": "<string>",
        "visibility": "PUBLIC",
        "skillMin": "JUNIOR",
        "skillMax": "JUNIOR",
        "description": "<string>",
        "status": "DRAFT"
      }
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: ""
order: 1000
