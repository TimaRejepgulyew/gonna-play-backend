$kind: http-request
name: /api/match/:id
url: "{{baseUrl}}/api/match/:id"
method: PATCH
headers:
  Content-Type: application/json
pathVariables:
  - key: id
    value: <string>
    description: "(Required) "
body:
  type: json
  content: |-
    {
      "title": "<string>",
      "startsAt": "<dateTime>",
      "durationMin": 60,
      "minPlayers": "<integer>",
      "maxPlayers": "<integer>",
      "price": "<number>",
      "currency": "<string>",
      "visibility": "PUBLIC",
      "skillMin": "JUNIOR",
      "skillMax": "JUNIOR",
      "description": "<string>",
      "status": "DRAFT"
    }
examples: ./.resources/-api-match-id 1.resources/examples
order: 2000
